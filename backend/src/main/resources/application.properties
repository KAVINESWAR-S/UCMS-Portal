# Server Configuration
server.port=${PORT:8080}
spring.profiles.active=${SPRING_PROFILES_ACTIVE:h2}

# Default Local H2 File-based Datasource
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/ucmsdb;AUTO_SERVER=TRUE;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

# JPA / Hibernate Configuration
spring.jpa.database-platform=${DB_DIALECT:org.hibernate.dialect.H2Dialect}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=false

# H2 Web Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JWT Security Configuration
app.jwt.secret=${JWT_SECRET:defaultSecretKeyForUCMSDevelopmentOnlyDoNotUseInProduction32Chars!}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# FastAPI AI Service Configuration
app.ai.service.url=${AI_SERVICE_URL:http://localhost:8000}

# Multipart & Post Payload Configuration for Images & Documents
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=15MB
server.tomcat.max-http-form-post-size=15MB
server.tomcat.max-swallow-size=15MB
server.max-http-request-header-size=2MB
